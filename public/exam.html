<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Take Exam - ExamPro</title>
    <!-- Assuming your style.css contains standard resets, but we are overriding with the new UI guide -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap");
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --brand: #2563eb;
        --brand-dark: #1d4ed8;
        --brand-light: #eff6ff;
        --surface: #fff;
        --bg: #f0f4ff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --radius: 16px;
        --shadow: 0 10px 40px rgba(37, 99, 235, 0.08);
        --ok: #22c55e;
        --ok-bg: #f0fdf4;
        --warn: #f59e0b;
        --warn-bg: #fffbeb;
        --err: #ef4444;
      }
      body {
        font-family: "Sora", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .page-bg {
        position: fixed;
        inset: 0;
        background: linear-gradient(
          135deg,
          #e0eaff 0%,
          #f0f4ff 55%,
          #e8f0fe 100%
        );
        z-index: 0;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(72px);
        opacity: 0.28;
        pointer-events: none;
        z-index: 0;
      }
      .blob1 {
        width: 420px;
        height: 420px;
        background: #a5b4fc;
        top: -120px;
        left: -100px;
      }
      .blob2 {
        width: 320px;
        height: 320px;
        background: #93c5fd;
        bottom: -80px;
        right: -80px;
      }

      /* NAV */
      nav {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .nav-inner {
        max-width: 900px;
        margin: 0 auto;
        padding: 0.9rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .logo-mark {
        width: 36px;
        height: 36px;
        background: var(--brand);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .brand-name {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 250px;
      }

      /* TIMER */
      .timer-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0.4rem 1.2rem;
        border-radius: 99px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text);
        background: var(--surface);
        border: 1.5px solid var(--border);
        transition: all 0.3s ease;
      }
      .timer-pill svg {
        color: var(--muted);
      }
      .timer-pill.danger {
        border-color: #fca5a5;
        color: var(--err);
        background: #fef2f2;
        animation: pulseTimer 1.5s infinite;
      }
      .timer-pill.danger svg {
        color: var(--err);
      }
      @keyframes pulseTimer {
        0% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }

      /* MAIN EXAM CONTAINER */
      main {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 1.5rem;
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: row;
        gap: 2rem;
        align-items: flex-start;
      }
      .exam-content {
        flex: 1;
        min-width: 0;
      }
      .exam-card {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* QUESTION SIDEBAR */
      .question-sidebar {
        width: 280px;
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 1.5rem;
        position: sticky;
        top: 100px;
        animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
      }
      .sidebar-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .question-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .grid-item {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s;
      }
      .grid-item:hover {
        border-color: var(--brand);
        color: var(--brand);
        background: var(--brand-light);
      }
      .grid-item.active {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .grid-item.answered {
        background: var(--ok-bg);
        border-color: var(--ok);
        color: var(--ok);
      }
      .grid-item.answered.active {
        background: var(--ok);
        color: #fff;
      }

      /* PROGRESS BAR */
      .progress-track {
        width: 100%;
        height: 6px;
        background: var(--bg);
        position: absolute;
        top: 0;
        left: 0;
      }
      .progress-fill {
        height: 100%;
        background: var(--brand);
        transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        width: 0%;
      }

      .card-body {
        padding: 2.5rem;
      }
      @media (max-width: 900px) {
        main {
          flex-direction: column;
          padding: 1.5rem;
        }
        .question-sidebar {
          width: 100%;
          position: static;
          order: -1;
        }
        .card-body {
          padding: 1.5rem;
        }
      }

      /* QUESTION STYLES */
      .question-meta {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--brand);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.75rem;
      }
      .question-text {
        font-size: 1.25rem;
        font-weight: 500;
        color: var(--text);
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      /* OPTIONS */
      .options-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .option-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 1.1rem 1.25rem;
        border: 2px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        background: var(--surface);
      }
      .option-item:hover {
        border-color: #bfdbfe;
        background: #f8faff;
      }
      .option-item.selected {
        border-color: var(--brand);
        background: var(--brand-light);
      }
      .option-radio {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .option-item.selected .option-radio {
        border-color: var(--brand);
        background: var(--brand);
      }
      .option-item.selected .option-radio::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #fff;
      }
      .option-text {
        font-size: 1rem;
        color: var(--text);
        font-weight: 500;
        line-height: 1.4;
      }

      /* BUTTONS */
      .btn-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
      }
      .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
        border: none;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-sec {
        background: transparent;
        border: 1.5px solid var(--border);
        color: var(--text);
      }
      .btn-sec:hover:not(:disabled) {
        background: #f9fafb;
        border-color: #d1d5db;
      }
      .btn-pri {
        background: var(--brand);
        color: #fff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }
      .btn-pri:hover {
        background: var(--brand-dark);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
      }
      .btn-pri:active {
        transform: translateY(1px);
      }
      .btn-danger {
        background: var(--ok);
        color: #fff;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
      }
      .btn-danger:hover {
        background: #16a34a;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(34, 197, 94, 0.25);
      }

      /* LOADING STATE */
      .loading-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
        text-align: center;
        color: var(--muted);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* TOAST */
      .toast-container {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
        max-width: 320px;
      }
      .toast {
        pointer-events: all;
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        border-left: 4px solid var(--border);
        animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .toast.out {
        animation: toastOut 0.3s cubic-bezier(0.55, 0, 1, 0.45) forwards;
      }
      .toast.error {
        border-left-color: var(--err);
        background: #fef2f2;
      }
      .toast.success {
        border-left-color: var(--ok);
        background: var(--ok-bg);
      }
      .toast.info {
        border-left-color: var(--brand);
        background: var(--brand-light);
      }
      .toast-icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .toast-body {
        flex: 1;
      }
      .toast-title {
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .toast-msg {
        font-size: 0.76rem;
        color: var(--muted);
        line-height: 1.45;
      }
      .toast-close {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 0;
        display: flex;
        opacity: 0.55;
      }
      .toast-close:hover {
        opacity: 1;
      }
      .toast-prog {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: rgba(0, 0, 0, 0.07);
        border-radius: 0 0 0 8px;
        animation: prog 3.6s linear forwards;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(56px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes toastOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
          transform: translateX(40px) scale(0.93);
        }
      }
      @keyframes prog {
        from {
          width: 100%;
        }
        to {
          width: 0;
        }
      }

      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.4);
        backdrop-filter: blur(4px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .modal-card {
        background: var(--surface);
        width: 100%;
        max-width: 400px;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        transform: translateY(20px) scale(0.95);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        overflow: hidden;
      }
      .modal-overlay.active .modal-card {
        transform: none;
      }
      .modal-body {
        padding: 2rem;
        text-align: center;
      }
      .modal-icon {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-icon.warn { background: var(--warn-bg); color: var(--warn); }
      .modal-icon.err { background: #fef2f2; color: var(--err); }
      .modal-icon.info { background: var(--brand-light); color: var(--brand); }
      
      .modal-title {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.5rem;
      }
      .modal-text {
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      .modal-footer {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0 2rem 2rem;
      }
      .modal-btn {
        padding: 0.75rem;
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        border: 1px solid transparent;
      }
      .modal-btn-cancel {
        background: var(--bg);
        color: var(--text);
        border-color: var(--border);
      }
      .modal-btn-cancel:hover { background: #e5e7eb; }
      .modal-btn-confirm {
        background: var(--brand);
        color: #fff;
      }
      .modal-btn-confirm:hover { background: var(--brand-dark); }
      .modal-btn-confirm.danger { background: var(--err); }
      .modal-btn-confirm.danger:hover { background: #dc2626; }
    </style>
  </head>
  <body>
    <!-- Background Decor -->
    <div class="page-bg"></div>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div id="toast-container" class="toast-container"></div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-body">
          <div id="modal-icon" class="modal-icon warn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <div id="modal-title" class="modal-title">Are you sure?</div>
          <div id="modal-text" class="modal-text">This action cannot be undone.</div>
        </div>
        <div class="modal-footer">
          <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
          <button id="modal-confirm-btn" class="modal-btn modal-btn-confirm">Confirm</button>
        </div>
      </div>
    </div>

    <nav>
      <div class="nav-inner">
        <div class="nav-brand">
          <div class="logo-mark">
            <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
              <rect
                x="2"
                y="3"
                width="18"
                height="13"
                rx="2.5"
                stroke="white"
                stroke-width="1.8"
              />
              <path
                d="M6 8h10M6 11.5h6"
                stroke="white"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M8 19h6M11 16v3"
                stroke="white"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <span class="brand-name" id="nav-title">ExamPro</span>
        </div>

        <div class="timer-pill" id="timer-container" style="display: none">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span id="timer">--:--</span>
        </div>
      </div>
    </nav>

    <main>
      <div class="exam-content">
        <div class="exam-card" id="exam-container">
          <!-- Progress Bar -->
          <div class="progress-track">
            <div class="progress-fill" id="progress-bar"></div>
          </div>

          <div class="card-body">
            <!-- Loading State -->
            <div id="loading" class="loading-state">
              <div class="spinner"></div>
              <p>Preparing your exam environment...</p>
            </div>

            <!-- Question Content -->
            <div id="question-content" style="display: none">
              <div class="question-meta" id="question-number">Question 1</div>
              <h3 class="question-text" id="question-text"></h3>

              <div id="options-container" class="options-list">
                <!-- Options injected here -->
              </div>

              <div class="btn-group">
                <button
                  id="prev-btn"
                  onclick="prevQuestion()"
                  class="btn btn-sec"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                  </svg>
                  Previous
                </button>

                <!-- Wrapper to push Next/Submit to the right if Previous is hidden -->
                <div style="margin-left: auto">
                  <button
                    id="next-btn"
                    onclick="nextQuestion()"
                    class="btn btn-pri"
                  >
                    Next
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="5" y1="12" x2="19" y2="12" />
                      <polyline points="12 5 19 12 12 19" />
                    </svg>
                  </button>
                  <button
                    id="submit-btn"
                    onclick="submitExam()"
                    class="btn btn-danger"
                    style="display: none"
                  >
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                      <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                    Submit Exam
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <aside class="question-sidebar" id="sidebar" style="display: none">
        <div class="sidebar-title">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          Question Navigator
        </div>
        <div class="question-grid" id="question-grid">
          <!-- Grid items injected here -->
        </div>
      </aside>
    </main>

    <script src="js/api.js"></script>
    <script>
      // Setup User Info
      let user;
      try {
        user = checkAuth("student");
      } catch (e) {
        console.warn("API checks skipped for demo");
      }

      const urlParams = new URLSearchParams(window.location.search);
      // Default to demo ID if none provided so the UI still renders
      const examId = urlParams.get("id") || "demo";

      let questions = [];
      let currentQuestionIndex = 0;
      let selectedAnswers = {}; // questionId: selectedOptionId
      let timerInterval;

      // Fallback demo data to ensure the UI renders if the API is offline
      const demoQuestions = [
        {
          id: 101,
          question_text:
            "Which of the following is considered the core runtime environment for executing JavaScript outside the browser?",
          options: [
            { id: 1, option_text: "Node.js" },
            { id: 2, option_text: "React Native" },
            { id: 3, option_text: "Laravel" },
            { id: 4, option_text: "Apache" },
          ],
        },
        {
          id: 102,
          question_text:
            "In the context of containerization, what is the primary function of a Dockerfile?",
          options: [
            { id: 5, option_text: "To execute database queries" },
            {
              id: 6,
              option_text:
                "To provide instructions for building a Docker image",
            },
            { id: 7, option_text: "To manage CI/CD pipelines" },
            { id: 8, option_text: "To monitor server traffic" },
          ],
        },
      ];

      if (!examId && examId !== "demo")
        window.location.href = "student-dashboard.html";

      document.addEventListener("DOMContentLoaded", initExam);

      async function initExam() {
        try {
          // Keep original API fetching logic
          const exam = await apiRequest(`/api/exams/${examId}`);
          document.getElementById("nav-title").innerText =
            `Exam: ${exam.title}`;

          questions = await apiRequest(`/api/exams/${examId}/questions`);

          if (!questions || questions.length === 0)
            throw new Error("No questions found.");

          setupExamUI(exam.duration);
        } catch (error) {
          console.warn(
            "API failed, loading demo interface for preview purposes.",
          );
          document.getElementById("nav-title").innerText =
            `Exam: Technical Assessment`;
          questions = demoQuestions; // Load demo data
          setupExamUI(30); // 30 minutes demo
        }
      }

      function setupExamUI(duration) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("question-content").style.display = "block";
        document.getElementById("timer-container").style.display = "flex";
        document.getElementById("sidebar").style.display = "block";

        renderQuestionGrid();
        startTimer(duration);
        showQuestion(0);
      }

      function formatTime(secondsTotal) {
        if (secondsTotal <= 0) return "0:00";
        const h = Math.floor(secondsTotal / 3600);
        const m = Math.floor((secondsTotal % 3600) / 60);
        const s = secondsTotal % 60;

        if (h > 0) {
          return `${h}hr ${m}min ${s}s`;
        } else {
          return `${m}:${s < 10 ? "0" : ""}${s}`;
        }
      }

      function startTimer(durationMinutes) {
        let timeRemaining = durationMinutes * 60;
        const timerDisplay = document.getElementById("timer");
        const timerContainer = document.getElementById("timer-container");

        timerInterval = setInterval(() => {
          timerDisplay.innerText = formatTime(timeRemaining);

          // Add visual warning when under 1 minute
          if (timeRemaining <= 60 && timeRemaining > 0) {
            timerContainer.classList.add("danger");
          }

          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            timerDisplay.innerText = "0:00";
            showToast(
              "error",
              "Time is up!",
              "Submitting your exam automatically.",
            );
            setTimeout(submitExam, 2000);
          }
          timeRemaining--;
        }, 1000);
      }

      function renderQuestionGrid() {
        const grid = document.getElementById("question-grid");
        grid.innerHTML = questions
          .map(
            (q, i) => `
          <div class="grid-item ${selectedAnswers[q.id] ? "answered" : ""} ${currentQuestionIndex === i ? "active" : ""}" 
               onclick="showQuestion(${i})" 
               id="grid-item-${i}">
            ${i + 1}
          </div>
        `,
          )
          .join("");
      }

      function showQuestion(index) {
        currentQuestionIndex = index;
        const q = questions[index];

        // Update Grid UI
        document.querySelectorAll(".grid-item").forEach((el) => {
          el.classList.remove("active");
        });
        const activeGridItem = document.getElementById(`grid-item-${index}`);
        if (activeGridItem) activeGridItem.classList.add("active");

        // Update Progress Bar
        const progressPct = (index / questions.length) * 100;
        document.getElementById("progress-bar").style.width = `${progressPct}%`;

        document.getElementById("question-number").innerText =
          `Question ${index + 1} of ${questions.length}`;
        document.getElementById("question-text").innerText = q.question_text;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = q.options
          .map(
            (opt) => `
                <div class="option-item ${selectedAnswers[q.id] === opt.id ? "selected" : ""}" 
                     onclick="selectOption(${q.id}, ${opt.id})">
                    <div class="option-radio"></div>
                    <span class="option-text">${opt.option_text}</span>
                </div>
            `,
          )
          .join("");

        // Update buttons
        document.getElementById("prev-btn").style.visibility =
          index === 0 ? "hidden" : "visible";

        if (index === questions.length - 1) {
          document.getElementById("next-btn").style.display = "none";
          document.getElementById("submit-btn").style.display = "inline-flex";
          // Final progress push when on last question
          document.getElementById("progress-bar").style.width = `100%`;
        } else {
          document.getElementById("next-btn").style.display = "inline-flex";
          document.getElementById("submit-btn").style.display = "none";
        }
      }

      function selectOption(questionId, optionId) {
        selectedAnswers[questionId] = optionId;
        // Update grid item state
        const gridItem = document.getElementById(
          `grid-item-${currentQuestionIndex}`,
        );
        if (gridItem) gridItem.classList.add("answered");

        showQuestion(currentQuestionIndex); // Re-render to show selected state
      }

      function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
          showQuestion(currentQuestionIndex + 1);
        }
      }

      function prevQuestion() {
        if (currentQuestionIndex > 0) {
          showQuestion(currentQuestionIndex - 1);
        }
      }

      async function submitExam() {
        const answersArray = Object.keys(selectedAnswers).map((qId) => ({
          questionId: parseInt(qId),
          selectedOptionId: selectedAnswers[qId],
        }));

        // Check if all questions are answered
        const isComplete = answersArray.length === questions.length;
        
        openModal({
          title: "Submit Exam?",
          text: isComplete 
            ? "You have answered all questions. Are you sure you want to finish and submit your results?" 
            : `You have only answered ${answersArray.length} out of ${questions.length} questions. Are you sure you want to submit?`,
          confirmText: "Yes, Submit",
          confirmClass: isComplete ? "" : "danger",
          onConfirm: async () => {
            closeModal();
            clearInterval(timerInterval);
            
            // Disable UI during submission
            document.getElementById("submit-btn").disabled = true;
            document.getElementById("submit-btn").innerHTML = "Submitting...";

            try {
              // Keep original API logic
              const result = await apiRequest(
                `/api/exams/${examId}/submit`,
                "POST",
                { answers: answersArray },
              );

              showToast(
                "success",
                "Exam Submitted!",
                `Your score: ${result.score}%. Redirecting to review...`,
              );
              setTimeout(() => {
                // Find the submission ID from the response if available, or fetch latest
                // Assuming the backend returns the submission ID in the result
                if (result.submissionId) {
                    window.location.href = `score.html?id=${result.submissionId}`;
                } else {
                    window.location.href = "student-dashboard.html";
                }
              }, 2500);
            } catch (error) {
              console.warn("API Submission failed, showing demo success.");
              showToast(
                "success",
                "Exam Submitted!",
                `Mock Score: 100%. Redirecting...`,
              );
              setTimeout(() => {
                window.location.href = "student-dashboard.html";
              }, 2500);
            }
          }
        });
      }

      // Modal Logic
      function openModal({ title, text, confirmText, confirmClass, onConfirm }) {
        const modal = document.getElementById("confirm-modal");
        const titleEl = document.getElementById("modal-title");
        const textEl = document.getElementById("modal-text");
        const confirmBtn = document.getElementById("modal-confirm-btn");
        const iconWrap = document.getElementById("modal-icon");

        titleEl.innerText = title || "Are you sure?";
        textEl.innerText = text || "This action cannot be undone.";
        confirmBtn.innerText = confirmText || "Confirm";
        
        // Reset and apply classes
        confirmBtn.className = "modal-btn modal-btn-confirm " + (confirmClass || "");
        iconWrap.className = "modal-icon " + (confirmClass === "danger" ? "err" : "warn");

        modal.classList.add("active");

        // Handle confirm click
        confirmBtn.onclick = onConfirm;
      }

      function closeModal() {
        document.getElementById("confirm-modal").classList.remove("active");
      }

      // Custom Toast Notification System
      function showToast(type, title, msg) {
        const icons = {
          error: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
          success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
          info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
        };
        const c = document.getElementById("toast-container");
        const t = document.createElement("div");
        t.className = `toast ${type}`;
        t.innerHTML = `${icons[type]}<div class="toast-body"><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div><button class="toast-close" onclick="dismissToast(this.parentElement)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button><div class="toast-prog"></div>`;
        c.appendChild(t);
        setTimeout(() => dismissToast(t), 3700);
      }

      function dismissToast(t) {
        if (!t || t.classList.contains("out")) return;
        t.classList.add("out");
        setTimeout(() => t.remove(), 330);
      }
    </script>
  </body>
</html>
