<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ExamPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --brand: #2563eb;
        --brand-dark: #1d4ed8;
        --brand-light: #eff6ff;
        --surface: #ffffff;
        --bg: #f0f4ff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --radius: 14px;
        --shadow: 0 8px 32px rgba(37, 99, 235, 0.1);
      }

      body {
        font-family: "Sora", sans-serif;
        background: var(--bg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      /* Background blobs */
      .page-bg {
        position: fixed;
        inset: 0;
        background: linear-gradient(
          135deg,
          #e0eaff 0%,
          #f0f4ff 50%,
          #e8f0fe 100%
        );
        z-index: 0;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        pointer-events: none;
        z-index: 0;
      }
      .blob1 {
        width: 340px;
        height: 340px;
        background: #a5b4fc;
        top: -80px;
        left: -80px;
      }
      .blob2 {
        width: 280px;
        height: 280px;
        background: #93c5fd;
        bottom: -60px;
        right: -60px;
      }

      /* Card */
      .card-wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(28px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Brand */
      .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
        margin-bottom: 2rem;
        animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .logo-mark {
        width: 40px;
        height: 40px;
        background: var(--brand);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .brand-name {
        font-size: 1.35rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
      }

      .card {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 2.25rem 2rem;
        border: 1px solid rgba(255, 255, 255, 0.8);
      }

      .card-head {
        text-align: center;
        margin-bottom: 1.75rem;
      }
      .card-head h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.02em;
        margin-bottom: 0.35rem;
      }
      .card-head p {
        font-size: 0.875rem;
        color: var(--muted);
      }

      /* Fields */
      .field {
        margin-bottom: 1.1rem;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 0.45rem;
        letter-spacing: 0.01em;
      }
      .input-wrap {
        position: relative;
      }
      .input-wrap input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--text);
        background: #fff;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
      }
      .input-wrap input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }
      .input-wrap input#password {
        padding-right: 2.8rem;
      }

      .input-wrap input.shake {
        animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
      }
      @keyframes shake {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(3px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-4px);
        }
        40%,
        60% {
          transform: translateX(4px);
        }
      }

      /* Eye toggle */
      .eye-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 4px;
        display: flex;
        align-items: center;
        transition: color 0.15s;
      }
      .eye-btn:hover {
        color: var(--brand);
      }

      /* Submit button */
      .btn {
        width: 100%;
        padding: 0.8rem;
        background: var(--brand);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.18s,
          transform 0.12s,
          box-shadow 0.18s;
        letter-spacing: -0.01em;
        margin-top: 0.5rem;
        position: relative;
        overflow: hidden;
      }
      .btn:hover {
        background: var(--brand-dark);
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.28);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.loading {
        pointer-events: none;
      }

      .btn-text {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: opacity 0.2s;
      }
      .btn.loading .btn-text {
        opacity: 0;
      }

      .spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        border: 2.5px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .btn.loading .spinner {
        opacity: 1;
      }
      @keyframes spin {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      /* Footer */
      .footer-text {
        text-align: center;
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 1.25rem;
      }
      .footer-text a {
        color: var(--brand);
        text-decoration: none;
        font-weight: 500;
      }
      .footer-text a:hover {
        text-decoration: underline;
      }

      /* Toast */
      .toast-container {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
        max-width: 340px;
      }
      .toast {
        pointer-events: all;
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 0.85rem 1rem;
        border-radius: 12px;
        background: var(--surface);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.12),
          0 2px 8px rgba(0, 0, 0, 0.06);
        border-left: 4px solid var(--border);
        animation: toastIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .toast.out {
        animation: toastOut 0.35s cubic-bezier(0.55, 0, 1, 0.45) forwards;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(60px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateX(40px) scale(0.92);
        }
      }
      .toast.error {
        border-left-color: #ef4444;
        background: #fef2f2;
      }
      .toast.success {
        border-left-color: #22c55e;
        background: #f0fdf4;
      }
      .toast.info {
        border-left-color: var(--brand);
        background: var(--brand-light);
      }

      .toast-icon {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .toast-body {
        flex: 1;
      }
      .toast-title {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 2px;
      }
      .toast.error .toast-title {
        color: #b91c1c;
      }
      .toast.success .toast-title {
        color: #15803d;
      }
      .toast.info .toast-title {
        color: #1d4ed8;
      }
      .toast-msg {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.5;
      }
      .toast-close {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        padding: 0;
        display: flex;
        flex-shrink: 0;
        opacity: 0.6;
        transition: opacity 0.15s;
      }
      .toast-close:hover {
        opacity: 1;
      }
      .toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 0 0 0 8px;
        animation: prog 3.5s linear forwards;
      }
      @keyframes prog {
        from {
          width: 100%;
        }
        to {
          width: 0%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-bg"></div>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div id="toast-container" class="toast-container"></div>

    <div class="card-wrap">
      <div class="nav-brand">
        <div class="logo-mark">
          <svg
            width="22"
            height="22"
            viewBox="0 0 22 22"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              x="2"
              y="3"
              width="18"
              height="13"
              rx="2.5"
              stroke="white"
              stroke-width="1.8"
            />
            <path
              d="M6 8h10M6 11.5h6"
              stroke="white"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M8 19h6"
              stroke="white"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M11 16v3"
              stroke="white"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <span class="brand-name">ExamPro</span>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Welcome back</h2>
          <p>Sign in to your account to continue</p>
        </div>

        <form id="login-form">
          <div class="field">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <input
                type="email"
                id="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="eye-btn"
                id="eye-btn"
                aria-label="Toggle password visibility"
              >
                <svg
                  id="eye-open"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  id="eye-closed"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="display: none"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                  />
                  <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn" id="login-btn">
            <span class="btn-text">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
              Sign in
            </span>
            <div class="spinner"></div>
          </button>
        </form>

        <p class="footer-text">
          Don't have an account? <a href="register.html">Create one free</a>
        </p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      // Password toggle
      const eyeBtn = document.getElementById("eye-btn");
      const pwInput = document.getElementById("password");
      const eyeOpen = document.getElementById("eye-open");
      const eyeClosed = document.getElementById("eye-closed");
      let pwVisible = false;

      eyeBtn.addEventListener("click", () => {
        pwVisible = !pwVisible;
        pwInput.type = pwVisible ? "text" : "password";
        eyeOpen.style.display = pwVisible ? "none" : "";
        eyeClosed.style.display = pwVisible ? "" : "none";
        pwInput.focus();
      });

      // Toast system
      function showToast(type, title, msg) {
        const icons = {
          error: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
          success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
          info: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
        };
        const container = document.getElementById("toast-container");
        const t = document.createElement("div");
        t.className = `toast ${type}`;
        t.innerHTML = `
                ${icons[type]}
                <div class="toast-body">
                    <div class="toast-title">${title}</div>
                    <div class="toast-msg">${msg}</div>
                </div>
                <button class="toast-close" onclick="dismissToast(this.parentElement)" aria-label="Close">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
                <div class="toast-progress"></div>
            `;
        container.appendChild(t);
        setTimeout(() => dismissToast(t), 3600);
      }

      function dismissToast(t) {
        if (!t || t.classList.contains("out")) return;
        t.classList.add("out");
        setTimeout(() => t.remove(), 360);
      }

      // Form submit
      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const password = pwInput.value;
          const btn = document.getElementById("login-btn");

          btn.classList.add("loading");

          try {
            const data = await apiRequest("/api/auth/login", "POST", {
              email,
              password,
            });
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            showToast(
              "success",
              "Signed in!",
              "Redirecting to your dashboard…",
            );

            setTimeout(() => {
              if (data.user.role === "admin") {
                window.location.href = "admin-dashboard.html";
              } else {
                window.location.href = "student-dashboard.html";
              }
            }, 1000);
          } catch (error) {
            showToast("error", "Login failed", error.message);
            pwInput.classList.remove("shake");
            void pwInput.offsetWidth;
            pwInput.classList.add("shake");
          } finally {
            btn.classList.remove("loading");
          }
        });
    </script>
  </body>
</html>
